<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
<style>
  .m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
  .fb{transform-box:fill-box}
  @keyframes rise{0%{transform:translateY(40px)}100%{transform:translateY(0)}}
  @keyframes drop{0%{opacity:0;transform:translateY(-70px)}55%{opacity:1;transform:translateY(8px)}75%{transform:translateY(-3px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes travel{0%{transform:translateX(0);opacity:0}5%{opacity:1}95%{opacity:1}100%{transform:translateX(1060px);opacity:0}}
  @keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:1}}

  .ttl{animation:rise .7s cubic-bezier(.16,1,.3,1) .1s both}
  .chip{opacity:0;animation:drop .8s cubic-bezier(.16,1,.3,1) forwards}
  .hl{animation:glow 3s ease-in-out infinite}
  .bus{stroke-dasharray:1060;stroke-dashoffset:1060;animation:draw 1.2s cubic-bezier(.7,0,.2,1) 1.4s forwards}
  .pkt{opacity:0;animation:travel 4s cubic-bezier(.45,0,.55,1) 2.6s infinite}
  .in{opacity:0;animation:fade .7s ease-out forwards}
</style>
<defs><clipPath id="ct"><rect x="40" y="25" width="600" height="40"/></clipPath></defs>
<rect width="1200" height="330" rx="24" fill="#0b1115"/>
<g clip-path="url(#ct)"><text class="m ttl" x="50" y="55" fill="#f7f4e9" font-size="24">MITRA://TOOLBOX</text></g>
<g class="m" font-size="18" text-anchor="middle">
  <g class="chip" style="animation-delay:.3s"><rect class="hl" x="50" y="90" width="160" height="95" rx="12" fill="#111c22" stroke="#63e6d3" stroke-width="2"/><text x="130" y="145" fill="#ffb84d">FLUTTER</text></g>
  <g class="chip" style="animation-delay:.42s"><rect class="hl" x="230" y="90" width="160" height="95" rx="12" fill="#111c22" stroke="#63e6d3" stroke-width="2" style="animation-delay:.5s"/><text x="310" y="145" fill="#ffb84d">DART</text></g>
  <g class="chip" style="animation-delay:.54s"><rect class="hl" x="410" y="90" width="160" height="95" rx="12" fill="#111c22" stroke="#63e6d3" stroke-width="2" style="animation-delay:1s"/><text x="490" y="145" fill="#ffb84d">ANDROID</text></g>
  <g class="chip" style="animation-delay:.66s"><rect class="hl" x="590" y="90" width="160" height="95" rx="12" fill="#111c22" stroke="#63e6d3" stroke-width="2" style="animation-delay:1.5s"/><text x="670" y="145" fill="#ffb84d">UI / UX</text></g>
  <g class="chip" style="animation-delay:.78s"><rect class="hl" x="770" y="90" width="160" height="95" rx="12" fill="#111c22" stroke="#63e6d3" stroke-width="2" style="animation-delay:2s"/><text x="850" y="145" fill="#ffb84d">JS · 3D</text></g>
  <g class="chip" style="animation-delay:.9s"><rect class="hl" x="950" y="90" width="160" height="95" rx="12" fill="#111c22" stroke="#63e6d3" stroke-width="2" style="animation-delay:2.5s"/><text x="1030" y="145" fill="#ffb84d">USB · DEVICE</text></g>
</g>
<path d="M50 230h1060" stroke="#1d2a30" stroke-width="2"/>
<path class="bus" d="M50 230h1060" stroke="#31434c" stroke-width="2"/>
<rect class="pkt" x="50" y="226" width="26" height="8" rx="4" fill="#63e6d3"/>
<g class="m in" style="animation-delay:1.9s">
  <text x="50" y="270" fill="#63e6d3" font-size="17">LEARNING BUS //</text>
  <text x="225" y="270" fill="#e8ece9" font-size="17">C/C++ · MEMORY · OPERATING SYSTEMS · NETWORKING · EMBEDDED</text>
  <text x="50" y="305" fill="#899aa2" font-size="14">learn the system → understand the behavior → build the product</text>
</g>
</svg>

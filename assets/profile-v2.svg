<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<style>
  .m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
  .fb{transform-box:fill-box}
  @keyframes win{0%{opacity:0;transform:scale(.94) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
  @keyframes slide{0%{opacity:0;transform:translateX(-30px)}100%{opacity:1;transform:translateX(0)}}
  @keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes load{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
  @keyframes dots{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
  @keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(360px)}}

  .win{transform-origin:center;opacity:0;animation:win .8s cubic-bezier(.16,1,.3,1) .1s forwards}
  .tl{opacity:0;transform-origin:center;animation:pop .45s cubic-bezier(.34,1.56,.64,1) forwards}
  .k{opacity:0;animation:slide .5s cubic-bezier(.16,1,.3,1) forwards}
  .t{transform-origin:left;animation:type .9s steps(40) both}
  .cur{animation:blink 1s steps(1) infinite}
  .bar{transform-origin:left;animation:load 3s cubic-bezier(.65,0,.35,1) 4.2s infinite both}
  .dt{animation:dots 1.2s ease-in-out infinite}
  .scan{animation:scan 6s linear infinite}
</style>
<defs>
  <linearGradient id="sc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63e6d3" stop-opacity="0"/><stop offset="1" stop-color="#63e6d3" stop-opacity=".07"/></linearGradient>
  <clipPath id="w"><rect x="30" y="28" width="1140" height="284" rx="16"/></clipPath>
  <clipPath id="c1"><rect class="t fb" x="225" y="88" width="900" height="30" style="animation-delay:.9s"/></clipPath>
  <clipPath id="c2"><rect class="t fb" x="225" y="126" width="900" height="30" style="animation-delay:1.4s"/></clipPath>
  <clipPath id="c3"><rect class="t fb" x="225" y="164" width="900" height="30" style="animation-delay:1.9s"/></clipPath>
  <clipPath id="c4"><rect class="t fb" x="225" y="202" width="900" height="30" style="animation-delay:2.4s"/></clipPath>
  <clipPath id="c5"><rect class="t fb" x="225" y="240" width="900" height="30" style="animation-delay:2.9s"/></clipPath>
  <clipPath id="c6"><rect class="t fb" x="225" y="278" width="900" height="30" style="animation-delay:3.4s"/></clipPath>
</defs>
<rect width="1200" height="340" rx="24" fill="#0b1115"/>
<g class="win fb">
  <rect x="30" y="28" width="1140" height="284" rx="16" fill="#101a20" stroke="#31434c" stroke-width="2"/>
  <g clip-path="url(#w)"><rect class="scan" x="30" y="0" width="1140" height="40" fill="url(#sc)"/></g>
  <circle class="tl fb" cx="58" cy="53" r="7" fill="#ff5d73" style="animation-delay:.5s"/>
  <circle class="tl fb" cx="82" cy="53" r="7" fill="#ffb84d" style="animation-delay:.6s"/>
  <circle class="tl fb" cx="106" cy="53" r="7" fill="#63e6d3" style="animation-delay:.7s"/>
  <text class="m" x="130" y="61" fill="#f7f4e9" font-size="20">MITRA://PROFILE</text>
  <text class="m" x="1010" y="61" fill="#5d7079" font-size="14">~/whoami</text>

  <g class="m" font-size="18">
    <g fill="#63e6d3">
      <text class="k" x="62" y="110" style="animation-delay:.8s">ROLE</text>
      <text class="k" x="62" y="148" style="animation-delay:1.3s">BUILDS</text>
      <text class="k" x="62" y="186" style="animation-delay:1.8s">FOCUS</text>
      <text class="k" x="62" y="224" style="animation-delay:2.3s">CURRENT</text>
      <text class="k" x="62" y="262" style="animation-delay:2.8s">DEEPENING</text>
      <text class="k" x="62" y="300" style="animation-delay:3.3s">STATUS</text>
    </g>
    <g fill="#e8ece9">
      <text clip-path="url(#c1)" x="230" y="110">Software Engineer · Flutter &amp; Android</text>
      <text clip-path="url(#c2)" x="230" y="148">Interfaces for real devices · interactive &amp; connected products</text>
      <text clip-path="url(#c3)" x="230" y="186">State · behavior · UI · architecture · debugging</text>
      <text clip-path="url(#c4)" x="230" y="224">Flutter · Dart · Android / AOSP · USB device comms · JavaScript</text>
      <text clip-path="url(#c5)" x="230" y="262">C/C++ · OS · networking · concurrency · embedded fundamentals</text>
      <g clip-path="url(#c6)">
        <text x="230" y="300" fill="#ffb84d">BUILDING</text>
        <text class="dt" x="318" y="300" fill="#ffb84d">.</text>
        <text class="dt" x="330" y="300" fill="#ffb84d" style="animation-delay:.2s">.</text>
        <text class="dt" x="342" y="300" fill="#ffb84d" style="animation-delay:.4s">.</text>
        <rect x="380" y="288" width="260" height="12" rx="6" fill="#17262d"/>
        <rect class="bar fb" x="380" y="288" width="260" height="12" rx="6" fill="#63e6d3"/>
      </g>
    </g>
  </g>
  <rect class="cur" x="660" y="286" width="11" height="18" fill="#63e6d3"/>
</g>
</svg>
